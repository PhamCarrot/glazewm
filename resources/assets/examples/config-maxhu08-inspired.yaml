# maxhu08-inspired GlazeWM profile.
# This intentionally keeps the slower, mildly elastic feel of the source.
animations:
  window_move:
    enabled: true
    duration_ms: 700
    easing: "cubic_bezier(0.05, 0.9, 0.1, 1.05)"
    threshold_px: 10
  window_resize:
    enabled: true
    duration_ms: 700
    easing: "cubic_bezier(0.05, 0.9, 0.1, 1.05)"
    threshold_px: 10
  focus_change:
    enabled: true
    duration_ms: 700
    easing: "ease_in_out"
  window_open:
    enabled: true
    duration_ms: 700
    easing: "cubic_bezier(0.05, 0.9, 0.1, 1.05)"
    style: "zoom"
    opacity_from: 0.8
  window_close:
    enabled: true
    duration_ms: 700
    easing: "ease_in_out"
    style: "zoom"
    opacity_to: 0.0
  workspace_switch:
    enabled: true
    duration_ms: 600
    easing: "cubic_bezier(0.05, 0.9, 0.1, 1.05)"
    style: "slide"
    direction: "horizontal"
    opacity_outgoing: 1.0
    opacity_incoming: 1.0
    zoom_factor: 0.08

gaps:
  scale_with_dpi: true
  inner_gap: "5px"
  outer_gap:
    top: "10px"
    right: "10px"
    bottom: "10px"
    left: "10px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#89b4fa"
    corner_style:
      enabled: true
      style: "rounded"
    transparency:
      enabled: true
      opacity: "100%"
    backdrop:
      enabled: true
      style: "acrylic"
      blur_amount: 36.0
      opacity: 1.0
      saturation: 1.0
  other_windows:
    border:
      enabled: true
      color: "#45475a"
    corner_style:
      enabled: true
      style: "rounded"
    transparency:
      enabled: true
      opacity: "95%"
    backdrop:
      enabled: true
      style: "acrylic"
      blur_amount: 36.0
      opacity: 1.0
      saturation: 1.0

workspaces:
  - name: "1"
  - name: "2"
  - name: "3"

keybindings:
  - commands: ["shell-exec wt"]
    bindings: ["alt+enter"]
  - commands: ["close"]
    bindings: ["alt+shift+q"]
  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
